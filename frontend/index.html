<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <!-- Home-screen "web app" mode: launched from the icon, the page runs
         fullscreen with no URL bar. Add via the browser's share sheet ->
         "Add to Home Screen"; the plain browser tab always keeps its bar. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lumen" />
    <link rel="manifest" href="manifest.json" />
    <title>Lumen</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="header" aria-live="polite">
        <span id="conn-indicator" class="status-pill conn-disconnected">disconnected</span>
        <h1 class="title">Lumen</h1>
        <span id="state-indicator" class="status-pill state-idle">idle</span>
      </header>

      <section class="controls">
        <div class="primary-controls">
          <button id="btn-start" class="btn btn-start">Start</button>
          <button id="btn-stop" class="btn btn-stop" disabled>Stop</button>
        </div>

        <button
          id="btn-ptt"
          class="btn btn-ptt"
          disabled
          aria-label="Push to talk - tap and hold anywhere on the screen while speaking"
        >
          <span class="ptt-icon" aria-hidden="true">&#127908;</span>
          <span class="ptt-label">Tap anywhere and hold to talk</span>
        </button>
      </section>

      <video id="video-preview" class="video-preview" autoplay muted playsinline
             aria-hidden="true"></video>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
